name: Headless validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Source and safety tests
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Public payload and static Power BI checks
        run: python -B tools/validate_public.py
      - name: Generate, snapshot, SQLite and KPI reconciliation
        run: python -B tools/reproduce.py --output "${{ runner.temp }}/retailpulse build"
      - name: Checkout remains unchanged
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) { throw "Reproduction changed source checkout: $changes" }
